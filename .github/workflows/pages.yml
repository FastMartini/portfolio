name: Verify and deploy portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  browser-tests:
    name: ${{ matrix.project }} (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && '["chromium"]' || '["chromium", "firefox-adaptive", "webkit-adaptive"]') }}
        shard: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && '[1]' || '[1, 2, 3, 4]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: |
          # Runner-selected EC2/Azure mirrors can stream packages for many minutes.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          browser="${{ matrix.project }}"
          npx playwright install --with-deps "${browser%-adaptive}"

      - name: Start a virtual audio output for native playback tests
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=portfolio_ci
          pactl set-default-sink portfolio_ci
          pactl list short sinks

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test the production static export
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: npm test -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4

      - name: Verify custom-domain metadata and routing without a project base path
        if: matrix.shard == 1 && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
        run: npm test -- tests/discoverability.spec.ts --project=${{ matrix.project }}
        env:
          TEST_SITE_BASE_PATH: ""
          TEST_PUBLIC_SITE_URL: "https://portfolio.example"
          TEST_SITE_PORT: "4180"

      - name: Refresh Linux visual baselines on a manually selected branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: npm test -- tests/ascent.spec.ts tests/climb-visual.spec.ts --grep snapshot --update-snapshots=all

      - name: Verify contact delivery with a mocked Web3Forms endpoint
        if: matrix.shard == 1 && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
        run: npm run test:contact-delivery -- --project=${{ matrix.project }}

      - name: Upload refreshed Linux visual baselines
        if: success() && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/*-snapshots/*-linux.png
          retention-days: 7

      - name: Upload visual test evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            test-results/
            tests/*-snapshots/
          retention-days: 7

  verify:
    if: always()
    needs: browser-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every browser shard to pass
        env:
          RESULT: ${{ needs.browser-tests.result }}
        run: test "$RESULT" = success

  build-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
