name: Diagnose Firefox audio
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install firefox
      - name: Probe without an audio server
        continue-on-error: true
        run: node scripts/probe-native-audio.mjs
      - name: Provide an audio output
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl list short sinks
      - name: Repeat the identical native probe
        run: node scripts/probe-native-audio.mjs
